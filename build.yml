# Builds the desktop installers on GitHub's computers and publishes them as a release,
# so the website's Download buttons always point at the newest ones.
# It runs when the studio or the desktop files change, or when you press "Run workflow" on the Actions tab.
# Changes to the website alone (the docs folder) don't start a build.
name: Build installers
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'build/**'
      - 'main.js'
      - 'package.json'
      - 'fetch-fonts.js'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node fetch-fonts.js
        continue-on-error: true
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: Arcanum-${{ runner.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-${{ github.run_number }}
          name: Arcanum desktop (build ${{ github.run_number }})
          body: Installers for Windows, Mac and Linux. Download them from the Arcanum website, or from the files below.
          make_latest: true
          files: out/*
